<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kana-kit — kana ↔ rōmaji playground</title>
    <meta
      name="description"
      content="A zero-dependency playground for converting Japanese kana and rōmaji, powered by kana-kit."
    />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b93a1b'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23fff'%3Eあ%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main class="card">
      <header class="masthead">
        <a class="brand" href="https://github.com/chopenguin/kana-kit">
          <span class="seal" aria-hidden="true">あ</span>
          <span class="wordmark">kana<span>‑kit</span></span>
        </a>
        <p class="tagline">
          Kana ↔ rōmaji, right in your browser. No dependencies, no build step.
        </p>
      </header>

      <nav class="tabs" aria-label="Conversion mode">
        <button type="button" class="tab" data-mode="romaji" aria-pressed="true">かな → rōmaji</button>
        <button type="button" class="tab" data-mode="kana" aria-pressed="false">rōmaji → かな</button>
        <button type="button" class="tab" data-mode="hiragana" aria-pressed="false">ひらがな → カタカナ</button>
        <button type="button" class="tab" data-mode="katakana" aria-pressed="false">カタカナ → ひらがな</button>
      </nav>

      <section class="panes">
        <div class="pane">
          <div class="pane-head">
            <label for="input" id="input-label">kana</label>
          </div>
          <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off">こんにちは、世界。</textarea>
        </div>
        <div class="pane">
          <div class="pane-head">
            <span>Output</span>
            <button type="button" class="copy" id="copy">Copy</button>
          </div>
          <output id="output" aria-live="polite"></output>
        </div>
      </section>

      <div class="controls">
        <label class="control" id="long-vowel-control">
          <span>Long vowel <code>ー</code></span>
          <select id="long-vowel">
            <option value="macron">ō (macron)</option>
            <option value="double">oo (double)</option>
            <option value="ignore">drop</option>
          </select>
        </label>
        <p class="note" id="note"></p>
      </div>

      <div class="examples" id="examples"></div>

      <footer>
        <span>MIT License</span>
        <span class="dot">·</span>
        <a href="https://github.com/chopenguin/kana-kit">GitHub</a>
        <span class="spacer"></span>
        <span>Zero dependencies</span>
      </footer>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
